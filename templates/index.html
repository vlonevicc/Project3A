<!DOCTYPE html>
<html>
<head>
    <title>Stock Chart Views</title>
</head>
<body>
    <h1>Stock Chart Generator</h1>
    
    {% if error %}
        <div style="color: red; padding: 10px; border: 1px solid red; margin: 10px 0;">
            <strong>Error:</strong> {{ error }}
        </div>
    {% endif %}
    
    <form method='POST'>
        <label>Stock Symbol (IBM, GOOGL, etc.)</label>
        <input type='text' name='symbol' required>
        <br><br>
        <label>Chart Type</label>
        <select name='chart_type'>
            <option value='Line'>Line Chart</option>
            <option value='Bar'>Bar Chart</option>
        </select>
        <br><br>
        <label>Time Series</label>
        <select name='function_choice'>
            <option value='1'>Intraday</option>
            <option value='2'>Daily</option>
            <option value='3'>Weekly</option>
            <option value='4'>Monthly</option>
        </select>
        <br><br>
        <label>Start Date</label>
        <input type='date' name='start_date' required>
        <br><br>
        <label>End Date</label>
        <input type='date' name='end_date' required>
        <br><br>
        <button type="submit">Create Chart</button>
    </form>
    
    {% if chart_svg %}
        <div style="margin-top: 30px;">
            <img src="{{ chart_svg }}" alt="Stock Chart">
        </div>
    {% endif %}
</body>
</html>
